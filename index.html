<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cornertime Wächter</title>
    <style>
        /* Grundlegendes Design im Dark-Mode-Stil passend zur Kamera */
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        #setupScreen {
            max-width: 500px;
            margin: 40px auto;
            padding: 30px;
            background-color: #2d2d2d;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            box-sizing: border-box;
        }

        #setupScreen h2 {
            margin-top: 0;
            color: #00ffcc;
            margin-bottom: 25px;
        }

        /* Formular-Gruppen */
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #bbbbbb;
            font-size: 0.9rem;
        }

        /* Eingabefelder, Selects und Textareas vereinheitlichen */
        #setupScreen input[type="text"],
        #setupScreen input[type="number"],
        #setupScreen input[type="password"],
        #setupScreen select,
        #setupScreen textarea {
            width: 100%;
            padding: 12px;
            margin-top: 2px;
            border: 1px solid #444;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
            background-color: #1e1e1e;
            color: #ffffff;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        #setupScreen input:focus,
        #setupScreen select:focus,
        #setupScreen textarea:focus {
            border-color: #00ffcc;
            box-shadow: 0 0 8px rgba(0, 255, 204, 0.2);
            outline: none;
        }

        #setupScreen option {
            background-color: #1e1e1e;
            color: #ffffff;
        }

        /* WhatsApp Import Textarea */
        #setupScreen textarea {
            resize: vertical;
            min-height: 80px;
            font-family: monospace;
            font-size: 0.85rem;
        }

        /* Checkbox (Blind-Modus) */
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 20px 0;
            cursor: pointer;
            text-align: left;
            color: #bbbbbb;
            font-size: 0.95rem;
        }

        .checkbox-group input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: #00ffcc;
            cursor: pointer;
        }

        /* Trennlinien */
        #setupScreen hr {
            border: 0;
            height: 1px;
            background: #444;
            margin: 30px 0;
        }

        .field-help {
            display: block;
            font-size: 0.75rem;
            color: #888888;
            margin-top: 5px;
        }

        /* Buttons */
        #setupScreen button {
            width: 100%;
            padding: 14px;
            background-color: #00ffcc;
            color: #1a1a1a;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 12px;
            transition: background-color 0.2s, transform 0.1s;
        }

        #setupScreen button:hover {
            background-color: #00ccaa;
        }

        #setupScreen button:active {
            transform: scale(0.98);
        }

        /* WhatsApp Button farblich abheben */
        #setupScreen .btn-whatsapp {
            background-color: #25D366;
            color: #ffffff;
        }
        #setupScreen .btn-whatsapp:hover {
            background-color: #1fba55;
        }
    </style> </head>
<body>

<div id="setupScreen">
    <h2>Cornertime Wächter Setup</h2>
    
    <div class="form-group">
        <label for="positionSelect">Position</label>
        <select id="positionSelect">
            <option value="STEHEND">Stehend</option>
            <option value="KNIEND_AUFRECHT">Kniend (Aufrecht)</option>
            <option value="KNIEND_SITZEND">Kniend (Sitzend)</option>
            <option value="KNIEND_VORGEBEUGT">Kniend (Vorgebeugt)</option>
        </select>
    </div>

    <div class="form-group">
        <label for="armSelect">Armhaltung</label>
        <select id="armSelect">
            <option value="UEBER_KOPF">Über Kopf</option>
            <option value="AUF_KOPF">Auf dem Kopf</option>
            <option value="HINTER_KOPF">Hinter dem Kopf</option>
            <option value="DREIZACK">Dreizack</option>
            <option value="RUECKEN_ELLBOGEN">Rücken (Ellbogen greifen)</option>
            <option value="RUECKEN_PO">Rücken (Hände auf Po)</option>
        </select>
    </div>

    <div class="form-group">
        <label for="legSelect">Beinhaltung</label>
        <select id="legSelect">
            <option value="NORMAL">Normal</option>
            <option value="ZUSAMMEN">Zusammen</option>
            <option value="GESPREIZT">Gespreizt</option>
        </select>
    </div>

    <div class="form-group">
        <label for="minDuration">Minimale Dauer (Sekunden)</label>
        <input type="number" id="minDuration" value="30">
    </div>

    <div class="form-group">
        <label for="maxDuration">Maximale Dauer (Sekunden)</label>
        <input type="number" id="maxDuration" value="45">
    </div>

    <div class="form-group">
        <label for="capDuration">Maximal-Deckel (Sekunden)</label>
        <input type="number" id="capDuration" value="120">
    </div>

    <div class="form-group">
        <label for="minPenalty">Minimale Strafe (Sekunden)</label>
        <input type="number" id="minPenalty" value="5">
    </div>

    <div class="form-group">
        <label for="maxPenalty">Maximale Strafe (Sekunden)</label>
        <input type="number" id="maxPenalty" value="10">
    </div>

    <div class="form-group">
        <label for="secretSalt">Geheimer Schlüssel (Salt / Passwort)</label>
        <input type="password" id="secretSalt" placeholder="Euer gemeinsames Passwort">
    </div>

    <label class="checkbox-group">
        <input type="checkbox" id="hideTimerCheckbox">
        <span>Blind-Modus (Timer verbergen)</span>
    </label>

    <div class="form-group">
        <label for="llamaEndpointInput">LlamaLab Automate Endpunkt (Optional)</label>
        <input type="text" id="llamaEndpointInput" placeholder="http://192.168.x.x:8080/endpoint">
        <span class="field-help">Netzwerk-URL, um Apps nach Erfolg via Intent freizuschalten.</span>
    </div>

    <hr>

    <div class="form-group">
        <label for="routineImportInput">Geheime WhatsApp-Routine importieren</label>
        <textarea id="routineImportInput" placeholder="Füge hier den Code ein, den dein Buddy dir geschickt hat..."></textarea>
        <span class="field-help">Leer lassen, wenn du die obigen Parameter direkt nutzen willst.</span>
    </div>

    <button onclick="startApp()">Wächter Starten</button>
    <button class="btn-whatsapp" onclick="generateRoutineString()">Routine erstellen & per WhatsApp senden</button>
</div>

<div id="activeScreen" style="display: none;">
    <div id="timerDisplay">00:00</div>
    <div id="status">Warte auf Kamera...</div>
    
    <div id="camContainer">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="processingCanvas"></canvas>
        
        <div id="ptHead" class="skeleton-point"></div>
        <div id="ptLShoulder" class="skeleton-point"></div>
        <div id="ptRShoulder" class="skeleton-point"></div>
        <div id="ptLElbow" class="skeleton-point"></div>
        <div id="ptRElbow" class="skeleton-point"></div>
        <div id="ptLWrist" class="skeleton-point"></div>
        <div id="ptRWrist" class="skeleton-point"></div>
        <div id="ptLHip" class="skeleton-point"></div>
        <div id="ptRHip" class="skeleton-point"></div>
        <div id="ptLKnee" class="skeleton-point"></div>
        <div id="ptRKnee" class="skeleton-point"></div>
        <div id="ptLFoot" class="skeleton-point"></div>
        <div id="ptRFoot" class="skeleton-point"></div>
    </div>
</div>

<div id="logScreen" style="display: none;">
    <h2 id="logTitle">Trainings-Report</h2>
    <textarea id="logOutput" readonly></textarea>
    
    <div id="verifyBadge" class="verification-badge" style="display: none;"></div>
    
    <div id="buddyVerifyBox" style="display: none;">
        <button onclick="verifyPastedLog()">Logfile jetzt kryptografisch prüfen</button>
    </div>
    
    <button onclick="location.reload()" style="background-color: #444; color: white; margin-top: 15px;">Zurück zum Hauptmenü</button>
</div>

<div style="margin-top: 30px;">
    <a href="#" onclick="showVerificationOption()" style="color: #00ffcc; text-decoration: none; font-size: 0.9rem;">-> Logfile eines Buddies verifizieren</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core@4.2.0/dist/tf-core.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl@4.2.0/dist/tf-backend-webgl.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1675469404/pose.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2.1.3/dist/pose-detection.min.js"></script>

<script src="app.js"></script>

</body>
</html>
