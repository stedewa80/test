<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CornerTime - HTML Tracker Fixed</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .app-container { width: 100%; max-width: 500px; text-align: center; }
        .status-message { font-size: 1.2rem; color: #00ffcc; margin-bottom: 20px; font-weight: bold; }
        
        /* Die Box hält das Video und den echten Kreis zusammen */
        .camera-box { 
            width: 100%; 
            border-radius: 20px; 
            border: 6px solid #333333; 
            overflow: hidden; 
            background: #000000; 
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
        }
        
        video#webcam {
            display: block;
            width: 100%;
            height: auto;
            transform: scaleX(-1); /* Spiegelmodus für das Video */
        }
        
        /* DIESER KREIS IST EIN ECHTES HTML-ELEMENT – UNZERSTÖRBAR */
        #htmlTargetCircle {
            position: absolute;
            width: 80px;
            height: 80px;
            border: 5px solid #00ffcc;
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.6);
            pointer-events: none;
            display: none; /* Wird erst eingeblendet, wenn der Kopf da ist */
            z-index: 99999;
            /* Zentriert den Punkt exakt auf den Koordinaten */
            transform: translate(-50%, -50%); 
            transition: left 0.05s ease, top 0.05s ease; /* Macht die Bewegung geschmeidig */
        }

        /* Ein kleiner Zielpunkt in der Mitte des Kreises */
        #htmlTargetCircle::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 8px;
            height: 8px;
            background: #00ffcc;
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/posenet"></script>
</head>
<body>

    <div class="app-container">
        <h2 style="margin-top: 0; color: #aaa;">Phase 1.3: Unblockbarer HTML-Kreis</h2>
        <div id="status" class="status-message">Kamera wird gestartet...</div>
        
        <div class="camera-box" id="camContainer">
            <video id="webcam" autoplay playsinline muted></video>
            <!-- Unser echtes HTML-Element, das über dem Video schwebt -->
            <div id="htmlTargetCircle"></div>
        </div>
        
        <p style="color: #666; font-size: 0.9rem; margin-top: 15px;">
            Da dies ein echtes HTML-Element ist, kann dein Browser es nicht ignorieren. Der Kreis MUSS jetzt sichtbar mitschweben!
        </p>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const container = document.getElementById('camContainer');
        const targetCircle = document.getElementById('htmlTargetCircle');
        const statusText = document.getElementById('status');
        
        let poseNetModel = null;
        let internalWidth = 640;
        let internalHeight = 480;

        async function initDiagnostic() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } }
                });
                video.srcObject = stream;
                
                video.onloadedmetadata = () => {
                    internalWidth = video.videoWidth || 640;
                    internalHeight = video.videoHeight || 480;
                    
                    statusText.innerText = "Lade schnelles KI-Modell...";
                    startAI();
                };
            } catch (err) {
                statusText.innerText = "Fehler: Kein Kamerazugriff.";
                console.error(err);
            }
        }

        async function startAI() {
            try {
                poseNetModel = await posenet.load({
                    architecture: 'MobileNetV1',
                    outputStride: 16,
                    inputResolution: { width: 257, height: 257 },
                    multiplier: 0.50
                });
                
                statusText.innerText = "KI Aktiviert! Suche Kopf...";
                requestAnimationFrame(processFrame);
            } catch (err) {
                statusText.innerText = "KI-Ladefehler.";
                console.error(err);
            }
        }

        async function processFrame() {
            if (video.readyState >= 2 && poseNetModel) {
                try {
                    // Berechne die aktuelle Position der Knochen
                    const pose = await poseNetModel.estimateSinglePose(video, { flipHorizontal: false });
                    
                    const nose = pose.keypoints.find(k => k.part === 'nose');
                    const leftEar = pose.keypoints.find(k => k.part === 'leftEar');
                    const rightEar = pose.keypoints.find(k => k.part === 'rightEar');

                    let headX = null;
                    let headY = null;

                    if (nose && nose.score > 0.45) {
                        headX = nose.position.x;
                        headY = nose.position.y;
                    } 
                    else if (leftEar && rightEar && leftEar.score > 0.35 && rightEar.score > 0.35) {
                        headX = (leftEar.position.x + rightEar.position.x) / 2;
                        headY = (leftEar.position.y + rightEar.position.y) / 2;
                    }

                    if (headX !== null && headY !== null) {
                        // --- MATHEMATISCHE SKALIERUNG AUF DIE DISPLAY-GRÖSSE ---
                        const containerWidth = container.clientWidth;
                        const containerHeight = container.clientHeight;

                        // Berechne, wo der Punkt prozentual im Videobild liegt
                        const percentX = headX / internalWidth;
                        const percentY = headY / internalHeight;

                        // Da das Video per CSS gespiegelt ist, müssen wir die X-Achse im HTML ebenfalls spiegeln!
                        const mirroredPercentX = 1 - percentX;

                        // Berechne die echten Pixel-Positionen auf deinem Handy-Bildschirm
                        const finalX = mirroredPercentX * containerWidth;
                        const finalY = percentY * containerHeight;

                        // Schiebe das HTML-Element an die exakte Position
                        targetCircle.style.left = `${finalX}px`;
                        targetCircle.style.top = `${finalY}px`;
                        targetCircle.style.display = 'block'; // Einblenden

                        statusText.innerText = "Kopf erfasst! 🟢";
                        statusText.style.color = "#00ffcc";
                    } else {
                        targetCircle.style.display = 'none'; // Ausblenden, wenn niemand da ist
                        statusText.innerText = "Suche Kopf... ⚪";
                        statusText.style.color = "#aaaaaa";
                    }

                } catch (err) {
                    console.error("Frame-Verarbeitungsfehler:", err);
                }
            }
            
            requestAnimationFrame(processFrame);
        }

        window.onload = initDiagnostic;
    </script>
</body>
</html>
