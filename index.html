<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CornerTime - Dynamic Checkpoint Guardian</title>
    <style>
        body { 
            background-color: #121212; 
            color: #fff; 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px; 
            box-sizing: border-box; 
        }
        
        .app-container { width: 100%; max-width: 400px; text-align: center; }
        
        /* Setup-Bildschirm */
        .setup-screen { 
            background: #1e1e1e; 
            padding: 25px; 
            border-radius: 20px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); 
            text-align: left; 
        }
        h2 { text-align: center; margin-top: 0; color: #00ffcc; }
        
        .option-row { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 18px; 
            border-bottom: 1px solid #333; 
            padding-bottom: 12px; 
        }
        
        /* iOS-Style Switch */
        .switch { position: relative; display: inline-block; width: 46px; height: 26px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { 
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; 
            background-color: #444; transition: .3s; border-radius: 26px; 
        }
        .slider:before { 
            position: absolute; content: ""; height: 18px; width: 18px; left: 4px; bottom: 4px; 
            background-color: white; transition: .3s; border-radius: 50%; 
        }
        input:checked + .slider { background-color: #007aff; }
        input:checked + .slider:before { transform: translateX(20px); }
        
        /* Aktiver Bildschirm */
        #activeScreen { display: none; width: 100%; }
        .status-message { font-size: 1.3rem; font-weight: bold; margin-bottom: 15px; min-height: 2rem; color: #00ffcc; text-align: center; }
        
        /* Das perfekte Quadrat-Gehäuse */
        .camera-box { 
            width: 100%; 
            border-radius: 20px; 
            border: 8px solid #333333; 
            overflow: hidden; 
            background: #000000; 
            position: relative; 
            aspect-ratio: 1 / 1;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        
        canvas#processingCanvas { display: block; width: 100%; height: 100%; object-fit: cover; }
        
        /* Unblockbare HTML-Indikatoren (Live-Punkte) */
        .joint-indicator { 
            position: absolute; width: 25px; height: 25px; border-radius: 50%; 
            pointer-events: none; display: none; z-index: 9999; transform: translate(-50%, -50%); 
            transition: left 0.05s linear, top 0.05s linear;
        }
        #ptHead { border: 4px solid #00ffcc; background: rgba(0,255,204,0.2); }
        #ptLShoulder, #ptRShoulder { border: 4px solid #28a745; background: rgba(40,167,69,0.2); }
        #ptLWrist, #ptRWrist { border: 4px solid #3399ff; background: rgba(51,153,255,0.2); }
        
        button.start-btn { 
            background: #007aff; color: white; border: none; padding: 16px; 
            font-size: 1.2rem; font-weight: bold; border-radius: 12px; 
            cursor: pointer; margin-top: 10px; width: 100%; box-shadow: 0 4px 10px rgba(0,122,255,0.3);
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/posenet"></script>
</head>
<body>

    <div class="app-container">
        <!-- SETUP SCREEN -->
        <div id="setupScreen" class="setup-screen">
            <h2>Wächter-Konfig</h2>
            <div class="option-row"><span>1. Dynamische Checkpoints</span><label class="switch"><input type="checkbox" id="modAnchor" checked><span class="slider"></span></label></div>
            <div class="option-row"><span>2. Anwesenheit (Anti-Cheat)</span><label class="switch"><input type="checkbox" id="modPresence" checked><span class="slider"></span></label></div>
            <div class="option-row"><span>3. Hände über Kopf (Pflicht)</span><label class="switch"><input type="checkbox" id="modHands" checked><span class="slider"></span></label></div>
            <div class="option-row"><span>4. Haltung (Schulter-Neigung)</span><label class="switch"><input type="checkbox" id="modPosture"><span class="slider"></span></label></div>
            <button class="start-btn" onclick="startApp()">ÜBERWACHUNG STARTEN</button>
        </div>

        <!-- ACTIVE APP SCREEN -->
        <div id="activeScreen">
            <div id="status" class="status-message">Kamera initialisieren...</div>
            
            <div class="camera-box" id="camContainer">
                <video id="webcam" autoplay playsinline muted style="display:none;"></video>
                <canvas id="processingCanvas"></canvas>
                
                <!-- Live-Tracking-Punkte -->
                <div id="ptHead" class="joint-indicator"></div>
                <div id="ptLShoulder" class="joint-indicator"></div>
                <div id="ptRShoulder" class="joint-indicator"></div>
                <div id="ptLWrist" class="joint-indicator"></div>
                <div id="ptRWrist" class="joint-indicator"></div>
            </div>
        </div>
    </div>

    <script {sandbox-attributes}>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('processingCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('camContainer');
        const status = document.getElementById('status');

        const pts = {
            head: document.getElementById('ptHead'),
            lS: document.getElementById('ptLShoulder'),
            rS: document.getElementById('ptRShoulder'),
            lW: document.getElementById('ptLWrist'),
            rW: document.getElementById('ptRWrist')
        };

        let net = null;
        let prevPose = null;   // Für die Echtzeit-Ruhe-Erkennung (Zappelfrei-Check)
        let anchorPose = null; // Der dynamisch überschreibbare Kontrollpunkt
        let isPrepared = false;
        let latestKeypoints = null; 

        // Variablen für das smarte Zeitfenster
        let movementDetectedTime = null; // Wann brach die Bewegung aus?
        let isGracePeriodActive = false;
        let lastSpokenTime = 0;

        function speak(text, force = false) {
            const now = Date.now();
            if (!force && (now - lastSpokenTime < 1500)) return; 
            lastSpokenTime = now;
            
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'de-DE';
            utterance.rate = 1.3;
            window.speechSynthesis.speak(utterance);
        }

        async function startApp() {
            window.speechSynthesis.speak(new SpeechSynthesisUtterance(''));

            document.getElementById('setupScreen').style.display = 'none';
            document.getElementById('activeScreen').style.display = 'block';
            
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } } 
                });
                video.srcObject = stream;
                
                video.onloadedmetadata = async () => {
                    status.innerText = "Lade schnelles KI-Modell...";
                    net = await posenet.load({ architecture: 'MobileNetV1', outputStride: 16, inputResolution: 257, multiplier: 0.50 });
                    
                    status.innerText = "In Position gehen! (5s)";
                    status.style.color = "#ffaa00";
                    speak("In Position gehen");
                    
                    loop();
                    
                    setTimeout(() => {
                        if (latestKeypoints && latestKeypoints.foundLShoulder && latestKeypoints.foundRShoulder) {
                            setNewAnchor("Wächter aktiv");
                        } else {
                            status.innerText = "Bitte SICHTBAR vor die Wand stellen...";
                            status.style.color = "#ff3333";
                            let retryAnchor = setInterval(() => {
                                if (latestKeypoints && latestKeypoints.foundLShoulder && latestKeypoints.foundRShoulder) {
                                    setNewAnchor("Wächter aktiv");
                                    clearInterval(retryAnchor);
                                }
                            }, 1000);
                        }
                    }, 5000);

                    setInterval(checkRules, 350);
                };
            } catch(e) {
                status.innerText = "Kamerafehler! Berechtigungen prüfen.";
                status.style.color = "red";
            }
        }

        // Hilfsfunktion: Speichert die aktuelle Position als unbestechlichen neuen Kontrollpunkt ein
        function setNewAnchor(audioMessage) {
            anchorPose = {
                shoulder: {
                    x: (latestKeypoints.lS.position.x + latestKeypoints.rS.position.x) / 2,
                    y: (latestKeypoints.lS.position.y + latestKeypoints.rS.position.y) / 2
                },
                head: (latestKeypoints.foundLeftEar && latestKeypoints.foundRightEar) ? {
                    x: (latestKeypoints.lE.position.x + latestKeypoints.rE.position.x) / 2,
                    y: (latestKeypoints.lE.position.y + latestKeypoints.rE.position.y) / 2
                } : null,
                lWrist: latestKeypoints.foundLWrist ? { x: latestKeypoints.lW.position.x, y: latestKeypoints.lW.position.y } : null,
                rWrist: latestKeypoints.foundRWrist ? { x: latestKeypoints.rW.position.x, y: latestKeypoints.rW.position.y } : null
            };

            isPrepared = true;
            isGracePeriodActive = false;
            movementDetectedTime = null;
            status.innerText = "Überwachung aktiv! 🟢";
            status.style.color = "#00ffcc";
            container.style.borderColor = "#333333";
            if (audioMessage) speak(audioMessage, true);
        }

        function loop() {
            canvas.width = 257; canvas.height = 257;
            const minDim = Math.min(video.videoWidth, video.videoHeight);
            const sx = (video.videoWidth - minDim) / 2;
            const sy = (video.videoHeight - minDim) / 2;

            ctx.save();
            ctx.translate(257, 0); ctx.scale(-1, 1);
            ctx.drawImage(video, sx, sy, minDim, minDim, 0, 0, 257, 257);
            ctx.restore();
            requestAnimationFrame(loop);
        }

        async function checkRules() {
            if (!net || video.readyState < 2) return;

            const pose = await net.estimateSinglePose(canvas);
            
            const lS = pose.keypoints.find(k => k.part === 'leftShoulder');
            const rS = pose.keypoints.find(k => k.part === 'rightShoulder');
            const lW = pose.keypoints.find(k => k.part === 'leftWrist');
            const rW = pose.keypoints.find(k => k.part === 'rightWrist');
            const lE = pose.keypoints.find(k => k.part === 'leftEar');
            const rE = pose.keypoints.find(k => k.part === 'rightEar');

            const foundLShoulder = lS && lS.score > 0.25;
            const foundRShoulder = rS && rS.score > 0.25;
            const foundLWrist = lW && lW.score > 0.25;
            const foundRWrist = rW && rW.score > 0.25;
            const foundLeftEar = lE && lE.score > 0.25;
            const foundRightEar = rE && rE.score > 0.25;

            latestKeypoints = { lS, rS, lW, rW, lE, rE, foundLShoulder, foundRShoulder, foundLWrist, foundRWrist, foundLeftEar, foundRightEar };

            // --- VISUELLE PUNKTE PLATZIEREN ---
            function drawIndicator(element, kp, isVisible) {
                if (isVisible) {
                    element.style.left = `${(kp.position.x / 257) * container.clientWidth}px`;
                    element.style.top = `${(kp.position.y / 257) * container.clientHeight}px`;
                    element.style.display = 'block';
                } else {
                    element.style.display = 'none';
                }
            }

            let mockHeadPoint = null;
            if (foundLeftEar && foundRightEar) {
                mockHeadPoint = { position: { x: (lE.position.x + rE.position.x) / 2, y: (lE.position.y + rE.position.y) / 2 } };
            }
            
            drawIndicator(pts.head, mockHeadPoint, (foundLeftEar && foundRightEar));
            drawIndicator(pts.lS, lS, foundLShoulder);
            drawIndicator(pts.rS, rS, foundRShoulder);
            drawIndicator(pts.lW, lW, foundLWrist);
            drawIndicator(pts.rW, rW, foundRWrist);

            if (!isPrepared || !anchorPose) return;

            // --- BEDINGUNGEN PRÜFEN (MÜSSEN IMMER ERFÜLLT SEIN) ---
            let conditionsMet = true;
            let conditionAlert = "";
            let conditionColor = "#ff3333";

            // Bedingung A: Hände über Kopfhöhe (Ohren-Höhe von hinten)
            if (document.getElementById('modHands').checked && foundLeftEar && foundRightEar) {
                const headY = (lE.position.y + rE.position.y) / 2;
                if ((foundLWrist && lW.position.y > headY) || (foundRWrist && rW.position.y > headY)) {
                    conditionsMet = false;
                    conditionAlert = "ARM-FEHLER: Hände runtergenommen! 🔵";
                    conditionColor = "#3399ff";
                    speak("Hände hoch");
                }
            }

            // Bedingung B: Haltung (Schulter-Neigung)
            if (document.getElementById('modPosture').checked && foundLShoulder && foundRShoulder) {
                const shoulderTilt = Math.abs(lS.position.y - rS.position.y);
                if (shoulderTilt > 22) {
                    conditionsMet = false;
                    conditionAlert = "HALTUNGS-FEHLER: Schiefe Schultern! 🟡";
                    conditionColor = "#ffcc00";
                    speak("Gerade");
                }
            }

            // Bedingung C: Grund-Anwesenheit
            if (document.getElementById('modPresence').checked && !foundLShoulder && !foundRShoulder) {
                conditionsMet = false;
                conditionAlert = "ANTI-CHEAT: Keine Person im Bild! 🔴";
                speak("Fehler");
            }

            // Falls eine Grundbedingung verletzt ist, wird das Zeitfenster sofort blockiert!
            if (!conditionsMet) {
                status.innerText = conditionAlert;
                status.style.color = conditionColor;
                container.style.borderColor = conditionColor;
                // Wir vergessen den Ausbruchs-Timer, da die Haltung erst wieder stimmen muss
                movementDetectedTime = null; 
                isGracePeriodActive = false;
                return;
            }

            // --- REINE POSITIONS-ÜBERWACHUNG (DYNAMISCHER ANKER) ---
            if (document.getElementById('modAnchor').checked) {
                let positionShifted = false;

                // Teste Abweichung vom gespeicherten Kontrollpunkt
                if (foundLShoulder && foundRShoulder) {
                    const shX = (lS.position.x + rS.position.x) / 2; const shY = (lS.position.y + rS.position.y) / 2;
                    if (Math.sqrt(Math.pow(shX - anchorPose.shoulder.x, 2) + Math.pow(shY - anchorPose.shoulder.y, 2)) > 11) positionShifted = true;
                }
                if (foundLeftEar && foundRightEar && anchorPose.head) {
                    const hdX = (lE.position.x + rE.position.x) / 2; const hdY = (lE.position.y + rE.position.y) / 2;
                    if (Math.sqrt(Math.pow(hdX - anchorPose.head.x, 2) + Math.pow(hdY - anchorPose.head.y, 2)) > 11) positionShifted = true;
                }

                if (positionShifted) {
                    const now = Date.now();
                    
                    // Erster Ausbruch: Wir starten das Zeitfenster
                    if (!isGracePeriodActive) {
                        isGracePeriodActive = true;
                        movementDetectedTime = now;
                        speak("Position verloren", true);
                    }

                    const elapsedSeconds = Math.floor((now - movementDetectedTime) / 1000);
                    const remainingSeconds = 3 - elapsedSeconds;

                    if (remainingSeconds > 0) {
                        status.innerText = `BEWEGUNG! Stabilisieren in ${remainingSeconds}s... ⏳`;
                        status.style.color = "#ffaa00";
                        container.style.borderColor = "#ffaa00";
                        speak(remainingSeconds.toString());
                    } else {
                        status.innerText = "ZEITFENSTER ABGELAUFEN! Position verloren! 🔴";
                        status.style.color = "#ff3333";
                        container.style.borderColor = "#ff3333";
                        speak("Zeit abgelaufen");
                    }
                } else {
                    // --- ZAPPEL-CHECK: VERSUCHT DER USER GERADE SICH NEU ZU STABILISIEREN? ---
                    if (isGracePeriodActive) {
                        // Wir prüfen, ob der Körper im aktuellen Frame komplett stillsteht (Zappelfrei-Test)
                        let bodyIsMovingNow = false;
                        if (prevPose && foundLShoulder && foundRShoulder) {
                            const curX = (lS.position.x + rS.position.x)/2; const curY = (lS.position.y + rS.position.y)/2;
                            if (Math.abs(curX - prevPose.shoulder.x) > 6 || Math.abs(curY - prevPose.shoulder.y) > 6) bodyIsMovingNow = true;
                        }

                        // Wenn er sich wegbewegt hat, aber jetzt stillsteht und die Bedingungen (oben geprüft) okay sind:
                        if (!bodyIsMovingNow) {
                            // BÄM! Neue Position einfrieren und weitermachen!
                            setNewAnchor("Checkpoint");
                        }
                    } else {
                        // Alles perfekt im Lot
                        status.innerText = "Überwachung aktiv! 🟢";
                        status.style.color = "#00ffcc";
                        container.style.borderColor = "#333333";
                    }
                }
            }

            // Kurzzeit-Gedächtnis für den Zappelfrei-Check aktualisieren
            prevPose = {
                shoulder: (foundLShoulder && foundRShoulder) ? { x: (lS.position.x + rS.position.x)/2, y: (lS.position.y + rS.position.y)/2 } : null
            };
        }
    </script>
</body>
</html>
