<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>CornerTime - Full Guardian Pro</title>
    <style>
        body { background-color: #121212; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; }
        .app-container { width: 100%; max-width: 400px; }
        .setup-screen { background: #1e1e1e; padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .option-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .camera-box { width: 100%; border-radius: 20px; border: 8px solid #333333; overflow: hidden; background: #000; position: relative; aspect-ratio: 1/1; transition: 0.3s; }
        canvas#processingCanvas { display: block; width: 100%; height: 100%; object-fit: cover; }
        .joint-indicator { position: absolute; width: 25px; height: 25px; border-radius: 50%; pointer-events: none; display: none; z-index: 999; transform: translate(-50%, -50%); border: 3px solid #00ffcc; transition: 0.05s linear; }
        #status { font-weight: bold; font-size: 1.2rem; margin-bottom: 15px; text-align: center; height: 2rem; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/posenet"></script>
</head>
<body>
    <div class="app-container">
        <div id="setupScreen" class="setup-screen">
            <h2>CornerTime Pro</h2>
            <div class="option-row"><span>Bewegung</span><input type="checkbox" id="modMotion" checked></div>
            <div class="option-row"><span>Anti-Cheat</span><input type="checkbox" id="modPresence" checked></div>
            <div class="option-row"><span>Hände-Hoch</span><input type="checkbox" id="modHands" checked></div>
            <div class="option-row"><span>Haltung</span><input type="checkbox" id="modPosture"></div>
            <button onclick="startApp()" style="width:100%; padding:15px; border:none; background:#007aff; color:white; border-radius:10px; font-weight:bold;">START</button>
        </div>

        <div id="activeScreen" style="display:none;">
            <div id="status">Warte...</div>
            <div class="camera-box" id="camContainer">
                <video id="webcam" autoplay playsinline muted style="display:none;"></video>
                <canvas id="processingCanvas"></canvas>
                <div id="ptNose" class="joint-indicator"></div>
                <div id="ptLShoulder" class="joint-indicator" style="border-color:#28a745"></div>
                <div id="ptRShoulder" class="joint-indicator" style="border-color:#28a745"></div>
                <div id="ptLWrist" class="joint-indicator" style="border-color:#3399ff"></div>
                <div id="ptRWrist" class="joint-indicator" style="border-color:#3399ff"></div>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('webcam'), canvas = document.getElementById('processingCanvas'), ctx = canvas.getContext('2d'), container = document.getElementById('camContainer'), status = document.getElementById('status');
        const pts = { n: document.getElementById('ptNose'), lS: document.getElementById('ptLShoulder'), rS: document.getElementById('ptRShoulder'), lW: document.getElementById('ptLWrist'), rW: document.getElementById('ptRWrist') };
        let net, prevNose = {x:0, y:0};

        async function startApp() {
            document.getElementById('setupScreen').style.display = 'none';
            document.getElementById('activeScreen').style.display = 'block';
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            video.srcObject = stream;
            net = await posenet.load({ architecture: 'MobileNetV1', outputStride: 16, inputResolution: 257, multiplier: 0.5 });
            renderLoop();
            setInterval(monitor, 300);
        }

        function renderLoop() {
            canvas.width = 257; canvas.height = 257;
            const minDim = Math.min(video.videoWidth, video.videoHeight);
            const sx = (video.videoWidth - minDim) / 2, sy = (video.videoHeight - minDim) / 2;
            ctx.save(); ctx.translate(257, 0); ctx.scale(-1, 1);
            ctx.drawImage(video, sx, sy, minDim, minDim, 0, 0, 257, 257);
            ctx.restore();
            requestAnimationFrame(renderLoop);
        }

        async function monitor() {
            const pose = await net.estimateSinglePose(canvas);
            const kp = { n: pose.keypoints.find(k=>k.part==='nose'), lS: pose.keypoints.find(k=>k.part==='leftShoulder'), rS: pose.keypoints.find(k=>k.part==='rightShoulder'), lW: pose.keypoints.find(k=>k.part==='leftWrist'), rW: pose.keypoints.find(k=>k.part==='rightWrist') };

            // Punkte zeigen
            Object.keys(pts).forEach(k => {
                if(kp[k] && kp[k].score > 0.3) {
                    pts[k].style.left = `${(kp[k].position.x/257)*container.clientWidth}px`;
                    pts[k].style.top = `${(kp[k].position.y/257)*container.clientHeight}px`;
                    pts[k].style.display = 'block';
                } else pts[k].style.display = 'none';
            });

            // Wächter-Logik
            let msg = "Alles im grünen Bereich 🟢", color = "#00ffcc"; container.style.borderColor = "#333";
            
            // Bewegung
            if(document.getElementById('modMotion').checked && kp.n && kp.n.score > 0.3) {
                if(Math.abs(kp.n.position.x - prevNose.x) > 30 || Math.abs(kp.n.position.y - prevNose.y) > 30) { msg = "BEWEGUNG! 🔴"; color = "red"; container.style.borderColor = "red"; }
                prevNose = kp.n.position;
            }
            // Presence
            if(document.getElementById('modPresence').checked && (!kp.lS || !kp.rS || kp.lS.score < 0.2)) { msg = "PERSON FEHLT! 🔴"; color = "red"; container.style.borderColor = "red"; }
            // Hände
            if(document.getElementById('modHands').checked && kp.n && kp.lW && kp.rW && (kp.lW.position.y > kp.n.position.y || kp.rW.position.y > kp.n.position.y)) { msg = "HÄNDE HOCH! 🔵"; color = "#3399ff"; container.style.borderColor = "#3399ff"; }
            // Haltung
            if(document.getElementById('modPosture').checked && kp.lS && kp.rS && Math.abs(kp.lS.position.y - kp.rS.position.y) > 25) { msg = "GERADE STEHEN! 🟡"; color = "#ffcc00"; container.style.borderColor = "#ffcc00"; }

            status.innerText = msg; status.style.color = color;
        }
    </script>
</body>
</html>
