<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CornerTime - Absolute Alignment</title>
    <style>
        body { background-color: #121212; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .camera-box { 
            width: 90%; max-width: 500px; border-radius: 20px; border: 6px solid #333333; 
            overflow: hidden; background: #000000; position: relative; 
        }
        /* KEIN SPIEGELN MEHR HIER */
        video#webcam { display: block; width: 100%; height: auto; transform: none; }
        
        #htmlTargetCircle {
            position: absolute;
            width: 70px; height: 70px;
            border: 5px solid #00ffcc; border-radius: 50%;
            pointer-events: none; display: none; z-index: 99999;
            transform: translate(-50%, -50%);
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/posenet"></script>
</head>
<body>
    <div class="camera-box" id="camContainer">
        <video id="webcam" autoplay playsinline muted></video>
        <div id="htmlTargetCircle"></div>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const container = document.getElementById('camContainer');
        const targetCircle = document.getElementById('htmlTargetCircle');

        async function init() {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
            video.srcObject = stream;
            video.onloadedmetadata = async () => {
                const net = await posenet.load();
                setInterval(async () => {
                    const pose = await net.estimateSinglePose(video);
                    const nose = pose.keypoints.find(k => k.part === 'nose');
                    
                    if (nose && nose.score > 0.4) {
                        // Direktes Mapping ohne Spiegel-Logik
                        const x = (nose.position.x / video.videoWidth) * container.clientWidth;
                        const y = (nose.position.y / video.videoHeight) * container.clientHeight;
                        
                        targetCircle.style.left = `${x}px`;
                        targetCircle.style.top = `${y}px`;
                        targetCircle.style.display = 'block';
                    } else {
                        targetCircle.style.display = 'none';
                    }
                }, 100);
            };
        }
        init();
    </script>
</body>
</html>
