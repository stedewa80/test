<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CornerTime - Aspect Ratio Fix</title>
    <style>
        body { background-color: #121212; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; color: #fff; font-family: sans-serif; }
        
        .camera-box { 
            width: 90%; 
            max-width: 400px; /* Schön kompakt für Smartphones */
            border-radius: 20px; 
            border: 6px solid #333333; 
            overflow: hidden; 
            background: #000000; 
            position: relative; 
            /* Ein perfektes Quadrat erzwingen */
            aspect-ratio: 1 / 1;
        }
        
        canvas#processingCanvas { 
            display: block; 
            width: 100%; 
            height: 100%; 
            object-fit: cover;
        }
        
        #htmlTargetCircle {
            position: absolute; 
            width: 50px; height: 50px;
            border: 4px solid #00ffcc; border-radius: 50%;
            pointer-events: none; display: none; z-index: 99999;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.6);
        }
        #status { font-weight: bold; margin-bottom: 15px; color: #00ffcc; font-size: 1.2rem; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/posenet"></script>
</head>
<body>
    <div id="status">Kamera startet...</div>
    <div class="camera-box" id="camContainer">
        <video id="webcam" autoplay playsinline muted style="display:none;"></video>
        <canvas id="processingCanvas"></canvas>
        <div id="htmlTargetCircle"></div>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('processingCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('camContainer');
        const targetCircle = document.getElementById('htmlTargetCircle');
        const status = document.getElementById('status');

        async function init() {
            try {
                // Wir bitten das Handy um ein hochkant optimiertes Bild
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } } 
                });
                video.srcObject = stream;
                
                video.onloadedmetadata = async () => {
                    const net = await posenet.load({ architecture: 'MobileNetV1', outputStride: 16, inputResolution: 257, multiplier: 0.50 });
                    status.innerText = "Suche Gesicht...";

                    function loop() {
                        canvas.width = 257;
                        canvas.height = 257;

                        // --- SMART CROP & MIRROR LOGIK ---
                        // Wir schneiden die Mitte des Kamerabildes quadratisch aus, damit nichts verzerrt
                        const vWidth = video.videoWidth;
                        const vHeight = video.videoHeight;
                        const minDim = Math.min(vWidth, vHeight);
                        const sx = (vWidth - minDim) / 2;
                        const sy = (vHeight - minDim) / 2;

                        ctx.save();
                        // Spiegel-Effekt für die Anzeige aktivieren
                        ctx.translate(257, 0);
                        ctx.scale(-1, 1);

                        // Zeichne den quadratischen Ausschnitt gespiegelt auf das Canvas
                        ctx.drawImage(video, sx, sy, minDim, minDim, 0, 0, 257, 257);
                        ctx.restore();

                        requestAnimationFrame(loop);
                    }
                    loop();

                    setInterval(async () => {
                        const pose = await net.estimateSinglePose(canvas);
                        const nose = pose.keypoints.find(k => k.part === 'nose');
                        
                        if (nose && nose.score > 0.3) {
                            // Da das Canvas jetzt gespiegelt ist, rechnet PoseNet die Punkte bereits gespiegelt aus.
                            // Wir müssen die Punkte nur noch auf die aktuelle Breite des Containers hochrechnen!
                            const x = (nose.position.x / 257) * container.clientWidth;
                            const y = (nose.position.y / 257) * container.clientHeight;
                            
                            targetCircle.style.left = `${x}px`;
                            targetCircle.style.top = `${y}px`;
                            targetCircle.style.display = 'block';
                            status.innerText = "Kopf erfasst! 🟢";
                        } else {
                            targetCircle.style.display = 'none';
                            status.innerText = "Suche Kopf...";
                        }
                    }, 60); // Etwas schnellerer Intervall für flüssigeres Tracking
                };
            } catch(e) { 
                status.innerText = "Kamerafehler! Bitte Berechtigung prüfen."; 
            }
        }
        init();
    </script>
</body>
</html>
