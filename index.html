<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CornerTime - AI Head Diagnostic</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .app-container { width: 100%; max-width: 500px; text-align: center; }
        .status-message { font-size: 1.2rem; color: #00ffcc; margin-bottom: 20px; font-weight: bold; }
        
        .camera-box { 
            width: 100%; 
            border-radius: 20px; 
            border: 6px solid #333333; 
            overflow: hidden; 
            background: #000000; 
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
        }
        
        /* Wir nutzen nur noch das Canvas zur Anzeige, kein rohes Video-Element mehr */
        canvas#displayCanvas {
            display: block;
            width: 100%;
            height: auto;
            transform: scaleX(-1); /* Spiegelmodus */
        }
    </style>

    <!-- Absolut stabile Basis-Skripte -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.11.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/posenet@2.2.2/dist/posenet.min.js"></script>
</head>
<body>

    <div class="app-container">
        <h2 style="margin-top: 0; color: #aaa;">Phase 1: Kopf-Erkennung</h2>
        <div id="status" class="status-message">Kamera wird gestartet...</div>
        
        <div class="camera-box">
            <!-- Das versteckte Video liefert die Daten -->
            <video id="webcam" autoplay playsinline muted style="display:none;"></video>
            <!-- Das Canvas zeichnet das Video UND den Tracking-Kreis -->
            <canvas id="displayCanvas"></canvas>
        </div>
        
        <p style="color: #666; font-size: 0.9rem; margin-top: 15px;">
            Sobald die KI deinen Kopf erfasst, erscheint ein grüner Kreis auf deinem Gesicht/Hinterkopf.
        </p>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('displayCanvas');
        const ctx = canvas.getContext('2d');
        const statusText = document.getElementById('status');
        
        let poseNetModel = null;

        async function initDiagnostic() {
            try {
                // Erzwinge den sicheren CPU-Modus gegen Abstürze
                if (window.tf) {
                    await tf.setBackend('cpu');
                }

                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "user", width: 320, height: 240 }
                });
                video.srcObject = stream;
                
                video.onloadedmetadata = () => {
                    canvas.width = 320;
                    canvas.height = 240;
                    
                    statusText.innerText = "Lade PoseNet KI-Modell...";
                    startAI();
                };
            } catch (err) {
                statusText.innerText = "Fehler: Kein Kamerazugriff.";
                console.error(err);
            }
        }

        async function startAI() {
            try {
                poseNetModel = await posenet.load({
                    architecture: 'MobileNetV1',
                    outputStride: 16,
                    inputResolution: 257,
                    multiplier: 0.50
                });
                
                statusText.innerText = "KI Aktiviert! Suche Kopf...";
                // Starte die Render-Schleife (so schnell das Handy rechnen kann)
                requestAnimationFrame(processFrame);
            } catch (err) {
                statusText.innerText = "KI-Ladefehler.";
                console.error(err);
            }
        }

        async function processFrame() {
            if (video.readyState >= 2 && poseNetModel) {
                try {
                    // 1. Zeichne das aktuelle Kamerabild direkt auf das sichtbare Canvas
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    
                    // 2. Berechne das Skelett für dieses Frame
                    const pose = await poseNetModel.estimateSinglePose(video, { flipHorizontal: false });
                    
                    // 3. Suche nach Kopfpunkten (Nase, Augen oder Ohren)
                    const nose = pose.keypoints.find(k => k.part === 'nose');
                    const leftEar = pose.keypoints.find(k => k.part === 'leftEar');
                    const rightEar = pose.keypoints.find(k => k.part === 'rightEar');

                    let headX = null;
                    let headY = null;

                    // Wenn die Nase da ist (Vorderansicht)
                    if (nose && nose.score > 0.4) {
                        headX = nose.position.x;
                        headY = nose.position.y;
                    } 
                    // Wenn du von hinten stehst, sieht die KI oft nur die Ohren
                    else if (leftEar && rightEar && leftEar.score > 0.3 && rightEar.score > 0.3) {
                        headX = (leftEar.position.x + rightEar.position.x) / 2;
                        headY = (leftEar.position.y + rightEar.position.y) / 2;
                    }

                    // 4. ZEICHNE DEN GRÜNEN KREIS, wenn ein Kopf gefunden wurde
                    if (headX !== null && headY !== null) {
                        ctx.beginPath();
                        ctx.arc(headX, headY, 35, 0, 2 * Math.PI); // Kreis mit Radius 35 um den Kopf
                        ctx.strokeStyle = '#00ffcc'; // Hellgrün/Türkis
                        ctx.lineWidth = 4;
                        ctx.stroke();
                        
                        // Kleiner Zielpunkt in der Mitte
                        ctx.beginPath();
                        ctx.arc(headX, headY, 4, 0, 2 * Math.PI);
                        ctx.fillStyle = '#00ffcc';
                        ctx.fill();
                        
                        statusText.innerText = "Kopf erfasst! Tracking stabil. 🟢";
                        statusText.style.color = "#00ffcc";
                    } else {
                        statusText.innerText = "Suche Kopf... Stell dich vor die Kamera. ⚪";
                        statusText.style.color = "#aaaaaa";
                    }

                } catch (err) {
                    console.error("Frame-Verarbeitungsfehler:", err);
                }
            }
            
            // Schleife fortsetzen
            requestAnimationFrame(processFrame);
        }

        // Direkt beim Laden starten
        window.onload = initDiagnostic;
    </script>
</body>
</html>
