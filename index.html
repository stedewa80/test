<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CornerTime - HighSpeed Mirror Fixed</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .app-container { width: 100%; max-width: 500px; text-align: center; }
        .status-message { font-size: 1.2rem; color: #00ffcc; margin-bottom: 20px; font-weight: bold; }
        
        .camera-box { 
            width: 100%; 
            border-radius: 20px; 
            border: 6px solid #333333; 
            overflow: hidden; 
            background: #000000; 
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
        }
        
        /* Das CSS-Spiegeln wurde gelöscht, da wir es jetzt sauber im Code machen */
        canvas#displayCanvas {
            display: block;
            width: 100%;
            height: auto;
        }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/posenet"></script>
</head>
<body>

    <div class="app-container">
        <h2 style="margin-top: 0; color: #aaa;">Phase 1.2: Visueller Kreis-Fix</h2>
        <div id="status" class="status-message">Kamera wird gestartet...</div>
        
        <div class="camera-box">
            <video id="webcam" autoplay playsinline muted style="display:none;"></video>
            <canvas id="displayCanvas"></canvas>
        </div>
        
        <p style="color: #666; font-size: 0.9rem; margin-top: 15px;">
            Jetzt sollte der Kreis direkt auf deinem Kopf erscheinen und jede Bewegung flüssig mitmachen.
        </p>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('displayCanvas');
        const ctx = canvas.getContext('2d');
        const statusText = document.getElementById('status');
        
        let poseNetModel = null;

        async function initDiagnostic() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } }
                });
                video.srcObject = stream;
                
                video.onloadedmetadata = () => {
                    canvas.width = video.videoWidth || 640;
                    canvas.height = video.videoHeight || 480;
                    
                    statusText.innerText = "Lade schnelles KI-Modell...";
                    startAI();
                };
            } catch (err) {
                statusText.innerText = "Fehler: Kein Kamerazugriff.";
                console.error(err);
            }
        }

        async function startAI() {
            try {
                poseNetModel = await posenet.load({
                    architecture: 'MobileNetV1',
                    outputStride: 16,
                    inputResolution: { width: 257, height: 257 },
                    multiplier: 0.50
                });
                
                statusText.innerText = "KI Aktiviert! Suche Kopf...";
                requestAnimationFrame(processFrame);
            } catch (err) {
                statusText.innerText = "KI-Ladefehler.";
                console.error(err);
            }
        }

        async function processFrame() {
            if (video.readyState >= 2 && poseNetModel) {
                try {
                    if (canvas.width !== video.videoWidth) {
                        canvas.width = video.videoWidth;
                        canvas.height = video.videoHeight;
                    }

                    // --- INTEGRATION DES HARDWARE-SPIEGELS ---
                    ctx.save(); // Speichere den normalen Zustand
                    ctx.translate(canvas.width, 0); // Schiebe das Bild nach rechts
                    ctx.scale(-1, 1); // Spiegele die horizontale Achse

                    // 1. Zeichne das Kamerabild (wird durch das obige Setup automatisch mitgespiegelt)
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    
                    // 2. Berechne die Knochen
                    const pose = await poseNetModel.estimateSinglePose(video, { flipHorizontal: false });
                    
                    const nose = pose.keypoints.find(k => k.part === 'nose');
                    const leftEar = pose.keypoints.find(k => k.part === 'leftEar');
                    const rightEar = pose.keypoints.find(k => k.part === 'rightEar');

                    let headX = null;
                    let headY = null;

                    if (nose && nose.score > 0.45) {
                        headX = nose.position.x;
                        headY = nose.position.y;
                    } 
                    else if (leftEar && rightEar && leftEar.score > 0.35 && rightEar.score > 0.35) {
                        headX = (leftEar.position.x + rightEar.position.x) / 2;
                        headY = (leftEar.position.y + rightEar.position.y) / 2;
                    }

                    // 3. ZEICHNE DEN GRÜNEN KREIS
                    if (headX !== null && headY !== null) {
                        ctx.beginPath();
                        ctx.arc(headX, headY, 50, 0, 2 * Math.PI); 
                        ctx.strokeStyle = '#00ffcc'; 
                        ctx.lineWidth = 6; 
                        ctx.stroke();
                        
                        ctx.beginPath();
                        ctx.arc(headX, headY, 6, 0, 2 * Math.PI);
                        ctx.fillStyle = '#00ffcc';
                        ctx.fill();
                    }

                    ctx.restore(); // Setze den Zeichen-Zustand für das nächste Frame zurück

                    // Status-Text aktualisieren (außerhalb des Spiegels)
                    if (headX !== null && headY !== null) {
                        statusText.innerText = "Kopf erfasst! 🟢";
                        statusText.style.color = "#00ffcc";
                    } else {
                        statusText.innerText = "Suche Kopf... ⚪";
                        statusText.style.color = "#aaaaaa";
                    }

                } catch (err) {
                    console.error("Frame-Verarbeitungsfehler:", err);
                }
            }
            
            requestAnimationFrame(processFrame);
        }

        window.onload = initDiagnostic;
    </script>
</body>
</html>
