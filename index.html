<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CornerTime - Modular Guardian</title>
    <style>
        body { background-color: #121212; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; }
        .app-container { width: 100%; max-width: 400px; }
        .setup-screen { background: #1e1e1e; padding: 20px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .option-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .switch { position: relative; display: inline-block; width: 45px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #444; transition: .3s; border-radius: 24px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 4px; bottom: 4px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: #007aff; }
        input:checked + .slider:before { transform: translateX(20px); }
        
        /* Kamera-Box */
        #activeScreen { display: none; }
        .camera-box { width: 100%; border-radius: 20px; border: 6px solid #333333; overflow: hidden; background: #000; position: relative; aspect-ratio: 1/1; }
        canvas#processingCanvas { display: block; width: 100%; height: 100%; object-fit: cover; }
        .joint-indicator { position: absolute; width: 30px; height: 30px; border-radius: 50%; pointer-events: none; display: none; z-index: 999; transform: translate(-50%, -50%); border: 3px solid #00ffcc; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/posenet"></script>
</head>
<body>

    <div class="app-container">
        <!-- MODULARES SETUP -->
        <div id="setupScreen" class="setup-screen">
            <h2>Wächter-Konfig</h2>
            <div class="option-row"><span>1. Bewegung (Pixel)</span><label class="switch"><input type="checkbox" id="modMotion" checked><span class="slider"></span></label></div>
            <div class="option-row"><span>2. Anwesenheit (KI)</span><label class="switch"><input type="checkbox" id="modPresence" checked><span class="slider"></span></label></div>
            <div class="option-row"><span>3. Hände-Kontrolle</span><label class="switch"><input type="checkbox" id="modHands" checked><span class="slider"></span></label></div>
            <div class="option-row"><span>4. Haltung (Schultern)</span><label class="switch"><input type="checkbox" id="modPosture"><span class="slider"></span></label></div>
            <button onclick="startApp()" style="width:100%; padding:15px; border:none; background:#007aff; color:white; border-radius:10px; font-weight:bold;">START</button>
        </div>

        <!-- AKTIV -->
        <div id="activeScreen">
            <div id="status" style="margin-bottom:10px; font-weight:bold;">Starte...</div>
            <div class="camera-box" id="camContainer">
                <video id="webcam" autoplay playsinline muted style="display:none;"></video>
                <canvas id="processingCanvas"></canvas>
                <div id="ptNose" class="joint-indicator"></div>
                <div id="ptLShoulder" class="joint-indicator"></div>
                <div id="ptRShoulder" class="joint-indicator"></div>
            </div>
        </div>
    </div>

    <script>
        let net, video = document.getElementById('webcam'), canvas = document.getElementById('processingCanvas');
        let ctx = canvas.getContext('2d'), container = document.getElementById('camContainer');
        let pts = { nose: document.getElementById('ptNose'), lS: document.getElementById('ptLShoulder'), rS: document.getElementById('ptRShoulder') };

        async function startApp() {
            document.getElementById('setupScreen').style.display = 'none';
            document.getElementById('activeScreen').style.display = 'block';
            
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            video.srcObject = stream;
            net = await posenet.load();
            
            loop();
            setInterval(checkRules, 500); // Check-Intervall
        }

        function loop() {
            canvas.width = 257; canvas.height = 257;
            const minDim = Math.min(video.videoWidth, video.videoHeight);
            const sx = (video.videoWidth - minDim) / 2;
            const sy = (video.videoHeight - minDim) / 2;
            ctx.save(); ctx.translate(257, 0); ctx.scale(-1, 1);
            ctx.drawImage(video, sx, sy, minDim, minDim, 0, 0, 257, 257);
            ctx.restore();
            requestAnimationFrame(loop);
        }

        async function checkRules() {
            const pose = await net.estimateSinglePose(canvas);
            const n = pose.keypoints.find(k => k.part === 'nose'), lS = pose.keypoints.find(k => k.part === 'leftShoulder'), rS = pose.keypoints.find(k => k.part === 'rightShoulder');

            // Visuelle Punkte aktualisieren
            [n, lS, rS].forEach((p, i) => {
                let el = Object.values(pts)[i];
                if(p && p.score > 0.3) {
                    el.style.left = `${(p.position.x/257)*container.clientWidth}px`;
                    el.style.top = `${(p.position.y/257)*container.clientHeight}px`;
                    el.style.display = 'block';
                } else el.style.display = 'none';
            });

            // Modul-Logik hier einbauen (z.B. if(document.getElementById('modHands').checked) { ... })
            document.getElementById('status').innerText = "Wächter aktiv...";
        }
    </script>
</body>
</html>
