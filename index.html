<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CornerTime - Force Map</title>
    <style>
        body { background-color: #121212; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; color: #fff; }
        .camera-box { 
            width: 90%; max-width: 500px; border-radius: 20px; border: 6px solid #333333; 
            overflow: hidden; background: #000000; position: relative; 
        }
        video#webcam { display: block; width: 100%; height: auto; }
        #htmlTargetCircle {
            position: absolute; width: 60px; height: 60px;
            border: 5px solid #ff00ff; border-radius: 50%;
            pointer-events: none; display: none; z-index: 99999;
            transform: translate(-50%, -50%);
        }
        #status { font-weight: bold; margin-bottom: 10px; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/posenet"></script>
</head>
<body>
    <div id="status">Starte...</div>
    <div class="camera-box" id="camContainer">
        <video id="webcam" autoplay playsinline muted></video>
        <div id="htmlTargetCircle"></div>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const container = document.getElementById('camContainer');
        const targetCircle = document.getElementById('htmlTargetCircle');
        const status = document.getElementById('status');

        async function init() {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            video.srcObject = stream;
            
            const net = await posenet.load({
                architecture: 'MobileNetV1',
                outputStride: 16,
                inputResolution: 257,
                multiplier: 0.50
            });
            
            setInterval(async () => {
                const pose = await net.estimateSinglePose(video, { flipHorizontal: false });
                const nose = pose.keypoints.find(k => k.part === 'nose');
                
                if (nose && nose.score > 0.3) {
                    // WICHTIG: Hier skalieren wir auf das 257x257 Modell-Raster
                    const x = (nose.position.x / 257) * container.clientWidth;
                    const y = (nose.position.y / 257) * container.clientHeight;
                    
                    targetCircle.style.left = `${x}px`;
                    targetCircle.style.top = `${y}px`;
                    targetCircle.style.display = 'block';
                    status.innerText = "Kopf: " + Math.round(nose.position.x) + " / " + Math.round(nose.position.y);
                } else {
                    targetCircle.style.display = 'none';
                    status.innerText = "Suche Kopf...";
                }
            }, 100);
        }
        init();
    </script>
</body>
</html>
