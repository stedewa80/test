<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CornerTime - Pro Wächter (MediaPipe)</title>
    <style>
        body { 
            background-color: #121212; color: #fff; 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
            display: flex; flex-direction: column; align-items: center; 
            justify-content: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; 
        }
        .app-container { width: 100%; max-width: 400px; text-align: center; }
        .setup-screen { background: #1e1e1e; padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: left; }
        h2 { text-align: center; color: #00ffcc; margin-top: 0; margin-bottom: 20px; }
        h3 { font-size: 0.9rem; color: #aaa; text-transform: uppercase; margin-top: 20px; letter-spacing: 1px; }
        .option-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .custom-select { width: 100%; background: #2a2a2a; color: #fff; border: 2px solid #007aff; padding: 12px; border-radius: 10px; font-size: 1rem; font-weight: bold; cursor: pointer; outline: none; }
        
        .switch { position: relative; display: inline-block; width: 46px; height: 26px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #444; transition: .3s; border-radius: 26px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 4px; bottom: 4px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: #007aff; }
        input:checked + .slider:before { transform: translateX(20px); }
        input:disabled + .slider { background-color: #222; cursor: not-allowed; }
        
        .timer-display { font-size: 3.5rem; font-weight: 800; margin-bottom: 5px; font-variant-numeric: tabular-nums; transition: color 0.3s; }
        #activeScreen { display: none; width: 100%; }
        .status-message { font-size: 1.2rem; font-weight: bold; margin-bottom: 15px; min-height: 2rem; color: #00ffcc; }
        .camera-box { width: 100%; border-radius: 20px; border: 8px solid #333333; overflow: hidden; background: #000; position: relative; aspect-ratio: 1 / 1; box-shadow: 0 10px 30px rgba(0,0,0,0.5); transition: border-color 0.2s; }
        canvas#processingCanvas { display: block; width: 100%; height: 100%; object-fit: cover; }
        button.start-btn { background: #007aff; color: white; border: none; padding: 16px; font-size: 1.2rem; font-weight: bold; border-radius: 12px; cursor: pointer; margin-top: 20px; width: 100%; box-shadow: 0 4px 10px rgba(0,122,255,0.3); }
    </style>
    
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core@4.20.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl@4.20.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1675469404"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2.1.3"></script>
</head>
<body>
    <div class="app-container">
        <div id="setupScreen" class="setup-screen">
            <h2>Wächter Pro</h2>
            <h3>1. Position</h3>
            <select id="positionSelect" class="custom-select" onchange="adaptRulesToPosition()">
                <option value="STEHEND">Stehend (An der Wand)</option>
                <option value="KNIEND">Kniend (Frei / Wand)</option>
            </select>
            
            <h3>2. Arm-Regel</h3>
            <div class="option-row"><span>Hände über Kopf</span><label class="switch"><input type="checkbox" id="ruleOverHead" checked onchange="toggleExclusiveRules('ruleOverHead')"><span class="slider"></span></label></div>
            <div class="option-row"><span>Hände hinter Kopf</span><label class="switch"><input type="checkbox" id="ruleBehindHead" onchange="toggleExclusiveRules('ruleBehindHead')"><span class="slider"></span></label></div>
            <div class="option-row" id="rowBehindBack"><span>Arme hinter Rücken</span><label class="switch"><input type="checkbox" id="ruleBehindBack" onchange="toggleExclusiveRules('ruleBehindBack')"><span class="slider"></span></label></div>
            
            <h3>3. Symmetrie</h3>
            <div class="option-row"><span>Schulter-Neigung filtern</span><label class="switch"><input type="checkbox" id="ruleSymmetry"><span class="slider"></span></label></div>
            
            <button class="start-btn" onclick="startApp()">ÜBERWACHUNG STARTEN</button>
        </div>
        
        <div id="activeScreen">
            <div id="timerDisplay" class="timer-display">05:00</div>
            <div id="status" class="status-message">Kamera initialisieren...</div>
            <div class="camera-box" id="camContainer">
                <video id="webcam" autoplay playsinline muted style="display:none;"></video>
                <canvas id="processingCanvas"></canvas>
            </div>
        </div>
    </div>

    <script>
        // Logische Profile im Hintergrund mit prozentualen Toleranzen (skaliert über Schulberbreite)
        const DYNAMIC_LIMITS = {
            headOver: { joints: ['left_shoulder', 'right_shoulder', 'left_ear', 'right_ear', 'left_wrist', 'right_wrist'], lim: { shoulder: 0.12, head: 0.12, target: 0.16 } },
            headBehind: { joints: ['left_shoulder', 'right_shoulder', 'left_ear', 'right_ear', 'left_elbow', 'right_elbow'], lim: { shoulder: 0.10, head: 0.10, target: 0.13 } },
            backBehind: { joints: ['left_shoulder', 'right_shoulder', 'left_hip', 'right_hip', 'left_elbow', 'right_elbow'], lim: { shoulder: 0.11, head: 0.11, target: 0.15 } }
        };

        // DOM Elemente sauber deklariert
        const video = document.getElementById('webcam'), canvas = document.getElementById('processingCanvas'), ctx = canvas.getContext('2d');
        const container = document.getElementById('camContainer'), status = document.getElementById('status'), timerDisplay = document.getElementById('timerDisplay');

        let currentConfig = { pos: "STEHEND", mode: "headOver", symmetry: false };
        let detector = null, anchorPose = {}, isPrepared = false, latestKeypoints = {}, baseShoulderWidth = 100;
        let timeRemainingSeconds = 300, workoutInterval = null, isGracePeriodActive = false, lastSpokenTime = 0, errorCounter = 0, remainingSecondsCounter = 3;

        function adaptRulesToPosition() {
            const pos = document.getElementById('positionSelect').value;
            const rowBehindBack = document.getElementById('rowBehindBack');
            const cbBehindBack = document.getElementById('ruleBehindBack');
            if (pos === "KNIEND") {
                rowBehindBack.style.opacity = "0.3"; cbBehindBack.disabled = true;
                if (cbBehindBack.checked) { cbBehindBack.checked = false; document.getElementById('ruleOverHead').checked = true; }
            } else {
                rowBehindBack.style.opacity = "1"; cbBehindBack.disabled = false;
            }
        }

        function toggleExclusiveRules(activeId) {
            const rules = ['ruleOverHead', 'ruleBehindHead', 'ruleBehindBack'];
            if (document.getElementById(activeId).checked) {
                rules.forEach(id => { if (id !== activeId) document.getElementById(id).checked = false; });
            } else if (!rules.some(id => document.getElementById(id).checked)) {
                document.getElementById('ruleOverHead').checked = true;
            }
        }

        function speak(text, force = false) {
            try {
                if (force) { window.speechSynthesis.cancel(); }
                const utterance = new SpeechSynthesisUtterance(text); utterance.lang = 'de-DE'; utterance.rate = 1.1;
                window.speechSynthesis.speak(utterance);
            } catch (e) { console.log("Audiofehler:", e); }
        }

        function updateTimerUI() {
            if (timeRemainingSeconds < 0) timeRemainingSeconds = 0;
            const mins = Math.floor(timeRemainingSeconds / 60).toString().padStart(2, '0');
            const secs = (timeRemainingSeconds % 60).toString().padStart(2, '0');
            timerDisplay.innerText = `${mins}:${secs}`;
        }

        function f(part) { return latestKeypoints[part] && latestKeypoints[part].score > 0.4; }

        // --- BIOLOGISCHE HALTUNGS-VERIFIKATION ---
        function validatePositionConditions() {
            if (currentConfig.mode === "headOver") {
                if (!f('left_ear') || !f('right_ear') || !f('left_wrist') || !f('right_wrist')) return false;
                const headY = (latestKeypoints.left_ear.y + latestKeypoints.right_ear.y) / 2;
                if (latestKeypoints.left_wrist.y > headY || latestKeypoints.right_wrist.y > headY) return false; 
            }
            if (currentConfig.mode === "headBehind") {
                if (!f('left_shoulder') || !f('right_shoulder') || !f('left_elbow') || !f('right_elbow')) return false;
                const shoulderDist = Math.abs(latestKeypoints.left_shoulder.x - latestKeypoints.right_shoulder.x);
                const elbowDist = Math.abs(latestKeypoints.left_elbow.x - latestKeypoints.right_elbow.x);
                if (elbowDist < (shoulderDist * 1.35)) return false; 
            }
            if (currentConfig.mode === "backBehind") {
                if (!f('left_shoulder') || !f('right_shoulder') || !f('left_elbow') || !f('right_elbow')) return false;
                const avgShoulderY = (latestKeypoints.left_shoulder.y + latestKeypoints.right_shoulder.y) / 2;
                if (latestKeypoints.left_elbow.y < (avgShoulderY + 45) || latestKeypoints.right_elbow.y < (avgShoulderY + 45)) return false;
            }
            if (currentConfig.symmetry && f('left_shoulder') && f('right_shoulder')) {
                if (Math.abs(latestKeypoints.left_shoulder.y - latestKeypoints.right_shoulder.y) > 22) return false;
            }
            return true;
        }

        async function startApp() {
            currentConfig.pos = document.getElementById('positionSelect').value;
            currentConfig.symmetry = document.getElementById('ruleSymmetry').checked;
            if (document.getElementById('ruleBehindHead').checked) currentConfig.mode = "headBehind";
            else if (document.getElementById('ruleBehindBack').checked) currentConfig.mode = "backBehind";
            else currentConfig.mode = "headOver";

            document.getElementById('setupScreen').style.display = 'none';
            document.getElementById('activeScreen').style.display = 'block';
            updateTimerUI();
            
            try {
                status.innerText = "Kamera-Zugriff anfordern...";
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } } });
                video.srcObject = stream;
                
                video.onloadedmetadata = async () => {
                    status.innerText = "Lade stabiles MediaPipe-Modell...";
                    detector = await poseDetection.createDetector(poseDetection.SupportedModels.BlazePose, { 
                        runtime: 'mediapipe', modelType: 'lite', solutionPath: 'https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1675469404' 
                    });
                    
                    status.innerText = "In Position gehen! (5s)"; status.style.color = "#ffaa00"; speak("In Position gehen", true);
                    loop();
                    
                    setTimeout(async () => {
                        const poses = await detector.estimatePoses(canvas);
                        if (poses && poses.length > 0) {
                            poses[0].keypoints.forEach(k => latestKeypoints[k.name] = { x: k.x, y: k.y, score: k.score });
                            
                            if (f('left_shoulder') && f('right_shoulder') && validatePositionConditions()) {
                                initWorkout();
                            } else {
                                status.innerText = "Bitte korrekte Haltung einnehmen..."; status.style.color = "#ff3333";
                                let retryAnchor = setInterval(async () => {
                                    const p = await detector.estimatePoses(canvas);
                                    if(p && p.length > 0) {
                                        p[0].keypoints.forEach(k => latestKeypoints[k.name] = { x: k.x, y: k.y, score: k.score });
                                        if (f('left_shoulder') && f('right_shoulder') && validatePositionConditions()) { initWorkout(); clearInterval(retryAnchor); }
                                    }
                                }, 1000);
                            }
                        }
                    }, 5000);
                };
            } catch(e) { status.innerText = "Kamerafehler!"; status.style.color = "red"; console.error(e); }
        }

        function initWorkout() {
            setNewAnchor("Wächter aktiv");
            workoutInterval = setInterval(() => {
                if (isPrepared && !isGracePeriodActive) {
                    timeRemainingSeconds--; updateTimerUI();
                    if (timeRemainingSeconds <= 0) {
                        clearInterval(workoutInterval); isPrepared = false;
                        status.innerText = "TRAINING BEENDET! 🎉"; status.style.color = "#00ffcc"; timerDisplay.style.color = "#00ffcc"; speak("Training beendet. Ausgezeichnet.", true);
                    }
                }
            }, 1000);
            setInterval(checkRules, 1000); // Fester Scan-Takt für den Wächter
        }

        function setNewAnchor(audioMessage) {
            anchorPose = {};
            const activeProfile = DYNAMIC_LIMITS[currentConfig.mode];
            
            if (f('left_shoulder') && f('right_shoulder')) {
                baseShoulderWidth = Math.sqrt(Math.pow(latestKeypoints.left_shoulder.x - latestKeypoints.right_shoulder.x, 2) + Math.pow(latestKeypoints.left_shoulder.y - latestKeypoints.right_shoulder.y, 2));
            }
            activeProfile.joints.forEach(j => { if (f(j)) anchorPose[j] = { x: latestKeypoints[j].x, y: latestKeypoints[j].y }; });
            
            isPrepared = true; isGracePeriodActive = false; errorCounter = 0; remainingSecondsCounter = 3;
            status.innerText = "Überwachung aktiv! 🟢"; status.style.color = "#00ffcc"; timerDisplay.style.color = "#ffffff"; container.style.borderColor = "#333333";
            if (audioMessage) speak(audioMessage, true);
        }

        function loop() {
            canvas.width = 257; canvas.height = 257;
            const minDim = Math.min(video.videoWidth, video.videoHeight || 480);
            ctx.save(); ctx.translate(257, 0); ctx.scale(-1, 1);
            ctx.drawImage(video, (video.videoWidth - minDim) / 2, (video.videoHeight - minDim) / 2, minDim, minDim, 0, 0, 257, 257); ctx.restore();
            requestAnimationFrame(loop);
        }

        async function checkRules() {
            if (!detector || video.readyState < 2 || !isPrepared) return;
            const poses = await detector.estimatePoses(canvas);
            
            // Permanent aktiver Anti-Cheat Check
            if (!poses || poses.length === 0) {
                errorCounter++;
                if (errorCounter >= 2) {
                    status.innerText = "ANTI-CHEAT: Keine Person erkannt! 🔴"; status.style.color = "#ff3333"; timerDisplay.style.color = "#ff3333"; speak("Workout abgebrochen", true);
                    clearInterval(workoutInterval); isPrepared = false;
                }
                return;
            }

            latestKeypoints = {};
            poses[0].keypoints.forEach(k => { latestKeypoints[k.name] = { x: k.x, y: k.y, score: k.score }; });

            let positionShifted = false;
            const activeProfile = DYNAMIC_LIMITS[currentConfig.mode];

            activeProfile.joints.forEach(j => {
                if (f(j) && anchorPose[j]) {
                    let limitFactor = j.includes('shoulder') ? activeProfile.lim.shoulder : (j.includes('ear') || j.includes('hip') ? activeProfile.lim.head : activeProfile.lim.target);
                    const dynamicPixelLimit = limitFactor * baseShoulderWidth;
                    if (Math.sqrt(Math.pow(latestKeypoints[j].x - anchorPose[j].x, 2) + Math.pow(latestKeypoints[j].y - anchorPose[j].y, 2)) > dynamicPixelLimit) { 
                        positionShifted = true; 
                    }
                }
            });

            if (positionShifted || !validatePositionConditions()) {
                errorCounter++;
                if (errorCounter >= 2 || isGracePeriodActive) {
                    if (!isGracePeriodActive) { isGracePeriodActive = true; remainingSecondsCounter = 3; speak("Haltung korrigieren", true); }
                    
                    if (remainingSecondsCounter > 0) {
                        status.innerText = `KORREKTURZEIT! Noch ${remainingSecondsCounter}s... ⏳`;
                        status.style.color = "#ffaa00"; timerDisplay.style.color = "#ffaa00"; container.style.borderColor = "#ffaa00";
                        speak(remainingSecondsCounter.toString());
                        remainingSecondsCounter--;
                    } else {
                        if (validatePositionConditions()) { setNewAnchor("Checkpoint"); } 
                        else {
                            timeRemainingSeconds += 10; updateTimerUI(); speak("Strafe plus zehn Sekunden", true);
                            status.innerText = "HALTUNG FALSCH! +10s! Erneuter Versuch... ⏳";
                            status.style.color = "#ff3333"; timerDisplay.style.color = "#ff3333";
                            remainingSecondsCounter = 3;
                        }
                    }
                }
            } else { 
                errorCounter = 0; isGracePeriodActive = false;
                status.innerText = "Überwachung aktiv! 🟢"; status.style.color = "#00ffcc"; timerDisplay.style.color = "#ffffff"; container.style.borderColor = "#333333"; 
            }
        }
    </script>
</body>
</html>
