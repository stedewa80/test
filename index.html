<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CornerTime - Skeleton Diagnostic</title>
    <style>
        body { background-color: #121212; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; color: #fff; font-family: sans-serif; }
        
        .camera-box { 
            width: 90%; 
            max-width: 400px; 
            border-radius: 20px; 
            border: 6px solid #333333; 
            overflow: hidden; 
            background: #000000; 
            position: relative; 
            aspect-ratio: 1 / 1;
        }
        
        canvas#processingCanvas { 
            display: block; 
            width: 100%; 
            height: 100%; 
            object-fit: cover;
        }
        
        /* BASIS-STYLING FÜR ALLE TRACKING-PUNKTE */
        .joint-indicator {
            position: absolute; 
            width: 40px; height: 40px;
            border-radius: 50%;
            pointer-events: none; 
            display: none; 
            z-index: 99999;
            transform: translate(-50%, -50%);
            transition: left 0.05s linear, top 0.05s linear;
        }

        /* FARBEN FÜR DIE EINZELNEN KÖRPERTEILE */
        #circleNose { border: 4px solid #00ffcc; box-shadow: 0 0 15px rgba(0, 255, 204, 0.6); }
        #circleLeftShoulder, #circleRightShoulder { border: 4px solid #28a745; box-shadow: 0 0 15px rgba(40, 167, 69, 0.6); }
        #circleLeftWrist, #circleRightWrist { border: 4px solid #3399ff; box-shadow: 0 0 15px rgba(51, 153, 255, 0.6); }

        #status { font-weight: bold; margin-bottom: 15px; color: #00ffcc; font-size: 1.2rem; text-align: center; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/posenet"></script>
</head>
<body>
    <div id="status">Kamera startet...</div>
    <div class="camera-box" id="camContainer">
        <video id="webcam" autoplay playsinline muted style="display:none;"></video>
        <canvas id="processingCanvas"></canvas>
        
        <!-- Die unblockbaren HTML-Skelettpunkte -->
        <div id="circleNose" class="joint-indicator"></div>
        <div id="circleLeftShoulder" class="joint-indicator"></div>
        <div id="circleRightShoulder" class="joint-indicator"></div>
        <div id="circleLeftWrist" class="joint-indicator"></div>
        <div id="circleRightWrist" class="joint-indicator"></div>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('processingCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('camContainer');
        const status = document.getElementById('status');

        // HTML-Elemente für die Punkte greifen
        const joints = {
            nose: document.getElementById('circleNose'),
            leftShoulder: document.getElementById('circleLeftShoulder'),
            rightShoulder: document.getElementById('circleRightShoulder'),
            leftWrist: document.getElementById('circleLeftWrist'),
            rightWrist: document.getElementById('circleRightWrist')
        };

        async function init() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } } 
                });
                video.srcObject = stream;
                
                video.onloadedmetadata = async () => {
                    const net = await posenet.load({ architecture: 'MobileNetV1', outputStride: 16, inputResolution: 257, multiplier: 0.50 });
                    status.innerText = "Skelett-Erkennung aktiv...";

                    function loop() {
                        canvas.width = 257;
                        canvas.height = 257;

                        const vWidth = video.videoWidth;
                        const vHeight = video.videoHeight;
                        const minDim = Math.min(vWidth, vHeight);
                        const sx = (vWidth - minDim) / 2;
                        const sy = (vHeight - minDim) / 2;

                        ctx.save();
                        ctx.translate(257, 0);
                        ctx.scale(-1, 1);
                        ctx.drawImage(video, sx, sy, minDim, minDim, 0, 0, 257, 257);
                        ctx.restore();

                        requestAnimationFrame(loop);
                    }
                    loop();

                    // Erkennungsschleife
                    setInterval(async () => {
                        const pose = await net.estimateSinglePose(canvas);
                        
                        // Helferfunktion, um einen Punkt zu positionieren und zu skalieren
                        function updateJoint(partName, element, minScore = 0.3) {
                            const keypoint = pose.keypoints.find(k => k.part === partName);
                            
                            if (keypoint && keypoint.score > minScore) {
                                const x = (keypoint.position.x / 257) * container.clientWidth;
                                const y = (keypoint.position.y / 257) * container.clientHeight;
                                
                                element.style.left = `${x}px`;
                                element.style.top = `${y}px`;
                                element.style.display = 'block';
                                return true;
                            } else {
                                element.style.display = 'none';
                                return false;
                            }
                        }

                        // Alle 5 Punkte unabhängig voneinander updaten
                        const foundNose = updateJoint('nose', joints.nose, 0.35);
                        const foundLShoulder = updateJoint('leftShoulder', joints.leftShoulder, 0.3);
                        const foundRShoulder = updateJoint('rightShoulder', joints.rightShoulder, 0.3);
                        
                        // Bei den Handgelenken senken wir den Mindestwert leicht auf 0.25, 
                        // da Hände von hinten schwerer zu erkennen sind
                        const foundLWrist = updateJoint('leftWrist', joints.leftWrist, 0.25);
                        const foundRWrist = updateJoint('rightWrist', joints.rightWrist, 0.25);

                        // Status-Text dynamisch anpassen
                        if (foundLShoulder && foundRShoulder) {
                            if (foundLWrist && foundRWrist) {
                                status.innerText = "Perfekt! Volles Skelett erfasst. 🟢";
                                status.style.color = "#00ffcc";
                            } else {
                                status.innerText = "Körper da, suche Hände... 🔵";
                                status.style.color = "#3399ff";
                            }
                        } else {
                            status.innerText = "Suche Person... Stell dich ins Bild. ⚪";
                            status.style.color = "#aaaaaa";
                        }

                    }, 80);
                };
            } catch(e) { 
                status.innerText = "Kamerafehler!"; 
            }
        }
        init();
    </script>
</body>
</html>
