<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CornerTime - Profile Architecture</title>
    <style>
        body { 
            background-color: #121212; color: #fff; 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
            display: flex; flex-direction: column; align-items: center; 
            justify-content: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; 
        }
        .app-container { width: 100%; max-width: 400px; text-align: center; }
        .setup-screen { background: #1e1e1e; padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: left; }
        h2 { text-align: center; margin-top: 0; color: #00ffcc; }
        .option-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; border-bottom: 1px solid #333; padding-bottom: 12px; }
        
        /* Dropdown Styling */
        select.profile-select {
            width: 100%; background: #2a2a2a; color: #fff; border: 2px solid #007aff;
            padding: 12px; border-radius: 10px; font-size: 1rem; font-weight: bold;
            margin-bottom: 20px; outline: none; cursor: pointer;
        }
        
        .switch { position: relative; display: inline-block; width: 46px; height: 26px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #444; transition: .3s; border-radius: 26px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 4px; bottom: 4px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: #007aff; }
        input:checked + .slider:before { transform: translateX(20px); }
        .timer-display { font-size: 3.5rem; font-weight: 800; color: #ffffff; margin-bottom: 5px; font-variant-numeric: tabular-nums; transition: color 0.3s; }
        #activeScreen { display: none; width: 100%; }
        .status-message { font-size: 1.2rem; font-weight: bold; margin-bottom: 15px; min-height: 2rem; color: #00ffcc; text-align: center; }
        .camera-box { width: 100%; border-radius: 20px; border: 8px solid #333333; overflow: hidden; background: #000000; position: relative; aspect-ratio: 1 / 1; box-shadow: 0 10px 30px rgba(0,0,0,0.5); transition: border-color 0.2s, box-shadow 0.2s; }
        canvas#processingCanvas { display: block; width: 100%; height: 100%; object-fit: cover; }
        .joint-indicator { position: absolute; width: 25px; height: 25px; border-radius: 50%; pointer-events: none; display: none; z-index: 9999; transform: translate(-50%, -50%); transition: left 0.05s linear, top 0.05s linear; }
        #ptHead { border: 4px solid #00ffcc; background: rgba(0,255,204,0.2); }
        #ptLShoulder, #ptRShoulder { border: 4px solid #28a745; background: rgba(40,167,69,0.2); }
        #ptLWrist, #ptRWrist { border: 4px solid #3399ff; background: rgba(51,153,255,0.2); }
        button.start-btn { background: #007aff; color: white; border: none; padding: 16px; font-size: 1.2rem; font-weight: bold; border-radius: 12px; cursor: pointer; margin-top: 10px; width: 100%; box-shadow: 0 4px 10px rgba(0,122,255,0.3); }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/posenet"></script>
</head>
<body>
    <div class="app-container">
        <div id="setupScreen" class="setup-screen">
            <h2>Wächter-Profil</h2>
            
                        <!-- Profil-Auswahl-Menü -->
            <label for="profileSelect" style="display:block; font-size:0.9rem; color:#aaa; margin-bottom:5px;">Übungs-Position:</label>
            <select id="profileSelect" class="profile-select">
                <option value="STEHEND_RECK">1. Stehend (Hände über Kopf)</option>
                <option value="HINTER_KOPF">2. Stehend (Hände hinter dem Kopf)</option>
                <option value="HINTER_RUECKEN">3. Stehend (Arme hinter dem Rücken)</option>
            </select>

            <div class="option-row"><span>1. Dynamische Checkpoints</span><label class="switch"><input type="checkbox" id="modAnchor" checked><span class="slider"></span></label></div>
            <div class="option-row"><span>2. Anwesenheit (Anti-Cheat)</span><label class="switch"><input type="checkbox" id="modPresence" checked><span class="slider"></span></label></div>
            <div class="option-row"><span>3. Hände über Kopf (Pflicht)</span><label class="switch"><input type="checkbox" id="modHands" checked><span class="slider"></span></label></div>
            <div class="option-row"><span>4. Haltung (Schulter-Neigung)</span><label class="switch"><input type="checkbox" id="modPosture"><span class="slider"></span></label></div>
            <button class="start-btn" onclick="startApp()">ÜBERWACHUNG STARTEN</button>
        </div>
        <div id="activeScreen">
            <div id="timerDisplay" class="timer-display">05:00</div>
            <div id="status" class="status-message">Kamera initialisieren...</div>
            <div class="camera-box" id="camContainer">
                <video id="webcam" autoplay playsinline muted style="display:none;"></video>
                <canvas id="processingCanvas"></canvas>
                <div id="ptHead" class="joint-indicator"></div>
                <div id="ptLShoulder" class="joint-indicator"></div>
                <div id="ptRShoulder" class="joint-indicator"></div>
                <div id="ptLWrist" class="joint-indicator"></div>
                <div id="ptRWrist" class="joint-indicator"></div>
                <div id="ptLElbow" class="joint-indicator" style="border: 4px solid #ff00ff; background: rgba(255,0,255,0.2);"></div>
                <div id="ptREElbow" class="joint-indicator" style="border: 4px solid #ff00ff; background: rgba(255,0,255,0.2);"></div>                
            </div>
        </div>
    </div>
    <!-- NÄCHSTE NACHRICHT FOLGT MIT TEIL 2 -->
    <script>
        // --- DIE ERWEITERTE PROFIL-ARCHITEKTUR ---
        const ACTIVE_PROFILES = {
            "STEHEND_RECK": {
                joints: ['leftShoulder', 'rightShoulder', 'leftEar', 'rightEar', 'leftWrist', 'rightWrist'],
                limits: { leftShoulder: 11, rightShoulder: 11, leftEar: 11, rightEar: 11, leftWrist: 15, rightWrist: 15 },
                rules: { handsOverHead: true, handsBehindHead: false, armsBehindBack: false, checkPosture: true }
            },
            "HINTER_KOPF": {
                // Hier überwachen wir zusätzlich die Ellbogen, da sie die Stabilität halten!
                joints: ['leftShoulder', 'rightShoulder', 'leftEar', 'rightEar', 'leftElbow', 'rightElbow'],
                limits: { leftShoulder: 10, rightShoulder: 10, leftEar: 10, rightEar: 10, leftElbow: 12, rightElbow: 12 },
                rules: { handsOverHead: false, handsBehindHead: true, armsBehindBack: false, checkPosture: true }
            },
            "HINTER_RUECKEN": {
                // Hüfte wird hier zum wichtigen Ankerpunkt für die Arme
                joints: ['leftShoulder', 'rightShoulder', 'leftHip', 'rightHip', 'leftElbow', 'rightElbow'],
                limits: { leftShoulder: 11, rightShoulder: 11, leftHip: 10, rightHip: 10, leftElbow: 14, rightElbow: 14 },
                rules: { handsOverHead: false, handsBehindHead: false, armsBehindBack: true, checkPosture: true }
            }
        };

        let currentProfile = null;
        const video = document.getElementById('webcam'), canvas = document.getElementById('processingCanvas'), ctx = canvas.getContext('2d');
        const container = document.getElementById('camContainer'), status = document.getElementById('status'), timerDisplay = document.getElementById('timerDisplay');

        const pts = { head: document.getElementById('ptHead'), lS: document.getElementById('ptLShoulder'), rS: document.getElementById('ptRShoulder'), lW: document.getElementById('ptLWrist'), rW: document.getElementById('ptRWrist'), lE: document.getElementById('ptLElbow'), rE: document.getElementById('ptREElbow') };

        let net = null, prevPose = null, anchorPose = {}, isPrepared = false, latestKeypoints = null; 
        let timeRemainingSeconds = 300, workoutInterval = null, movementDetectedTime = null, isGracePeriodActive = false, lastSpokenTime = 0;

        function speak(text, force = false) {
            try {
                const now = Date.now(); if (!force && (now - lastSpokenTime < 1200)) return; lastSpokenTime = now;
                const utterance = new SpeechSynthesisUtterance(text); utterance.lang = 'de-DE'; utterance.rate = 1.3; window.speechSynthesis.speak(utterance);
            } catch (e) { console.log("Audiofehler:", e); }
        }

        function updateTimerUI() {
            if (timeRemainingSeconds < 0) timeRemainingSeconds = 0;
            const mins = Math.floor(timeRemainingSeconds / 60).toString().padStart(2, '0');
            const secs = (timeRemainingSeconds % 60).toString().padStart(2, '0');
            timerDisplay.innerText = `${mins}:${secs}`;
        }

        // Helfer-Funktion für die Gelenk-Sichtbarkeit
        function f(part) { return latestKeypoints && latestKeypoints[part] && latestKeypoints[part].score > 0.25; }

        // --- DEINE GEOMETRISCHEN REGELN (ZENTRAL GEBÜNDELT) ---
        function validatePositionConditions() {
            // Regel 1: Klassisch Hände hoch
            if (document.getElementById('modHands').checked && currentProfile.rules.handsOverHead) {
                if (!f('leftEar') || !f('rightEar') || !f('leftWrist') || !f('rightWrist')) return false;
                const lW = latestKeypoints.leftWrist.position, rW = latestKeypoints.rightWrist.position;
                if (Math.sqrt(Math.pow(lW.x - rW.x, 2) + Math.pow(lW.y - rW.y, 2)) < 5) return false; 
                const headY = (latestKeypoints.leftEar.position.y + latestKeypoints.rightEar.position.y) / 2;
                if (lW.y > headY || rW.y > headY) return false; 
            }
            
            // Regel 2: Hände hinter dem Kopf (Ellbogen-Check)
            if (document.getElementById('modHands').checked && currentProfile.rules.handsBehindHead) {
                if (!f('leftShoulder') || !f('rightShoulder') || !f('leftElbow') || !f('rightElbow')) return false;
                // Ellbogen müssen weiter außen sein als die Schultern (X-Achse im gespiegelten Bild beachten)
                // Bei korrekter Haltung ist der Abstand Ellbogen-Links zu Ellbogen-Rechts deutlich größer als Schulter zu Schulter
                const shoulderDist = Math.abs(latestKeypoints.leftShoulder.position.x - latestKeypoints.rightShoulder.position.x);
                const elbowDist = Math.abs(latestKeypoints.leftElbow.position.x - latestKeypoints.rightElbow.position.x);
                if (elbowDist < (shoulderDist * 1.3)) return false; // Sacken die Ellbogen nach vorne, wird das Verhältnis kleiner
            }

            // Regel 3: Arme hinter dem Rücken verschränkt
            if (document.getElementById('modHands').checked && currentProfile.rules.armsBehindBack) {
                // PoseNet verliert hier oft die Handgelenke (da verdeckt). Wir prüfen deshalb die Ellbogen-Tiefe relativ zur Schulter!
                if (!f('leftShoulder') || !f('rightShoulder') || !f('leftElbow') || !f('rightElbow')) return false;
                const avgShoulderY = (latestKeypoints.leftShoulder.position.y + latestKeypoints.rightShoulder.position.y) / 2;
                // Die Ellbogen müssen zwingend weit unterhalb der Schultern bleiben (großer Y-Wert)
                if (latestKeypoints.leftElbow.position.y < (avgShoulderY + 50) || latestKeypoints.rightElbow.position.y < (avgShoulderY + 50)) return false;
            }

            if (document.getElementById('modPosture').checked && currentProfile.rules.checkPosture && f('leftShoulder') && f('rightShoulder') && Math.abs(latestKeypoints.leftShoulder.position.y - latestKeypoints.rightShoulder.position.y) > 22) return false;
            if (prevPose && f('leftShoulder') && f('rightShoulder')) {
                const curX = (latestKeypoints.leftShoulder.position.x + latestKeypoints.rightShoulder.position.x)/2, curY = (latestKeypoints.leftShoulder.position.y + latestKeypoints.rightShoulder.position.y)/2;
                if (Math.abs(curX - prevPose.shoulder.x) > 5 || Math.abs(curY - prevPose.shoulder.y) > 5) return false;
            }
            return true;
        }

        async function startApp() {
            currentProfile = ACTIVE_PROFILES[document.getElementById('profileSelect').value];
            document.getElementById('setupScreen').style.display = 'none';
            document.getElementById('activeScreen').style.display = 'block';
            updateTimerUI(); 
            try {
                status.innerText = "Kamera-Zugriff anfordern...";
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } } });
                video.srcObject = stream;
                video.onloadedmetadata = async () => {
                    status.innerText = "Lade schnelles KI-Modell...";
                    net = await posenet.load({ architecture: 'MobileNetV1', outputStride: 16, inputResolution: 257, multiplier: 0.50 });
                    status.innerText = "In Position gehen! (5s)"; status.style.color = "#ffaa00"; speak("In Position gehen", true);
                    loop();
                    
                    // Start-Schleife: Wächter schaltet erst ein, wenn du richtig stehst!
                    setTimeout(() => {
                        if (f('leftShoulder') && f('rightShoulder') && validatePositionConditions()) { 
                            initWorkout(); 
                        } else {
                            status.innerText = "Bitte korrekte Haltung einnehmen (Hände hoch!)..."; 
                            status.style.color = "#ff3333";
                            let retryAnchor = setInterval(() => { 
                                if (f('leftShoulder') && f('rightShoulder') && validatePositionConditions()) { 
                                    initWorkout(); clearInterval(retryAnchor); 
                                } 
                            }, 1000);
                        }
                    }, 5000);
                    setInterval(checkRules, 350);
                };
            } catch(e) { status.innerText = "Kamerafehler! Berechtigungen prüfen."; status.style.color = "red"; }
        }

        function initWorkout() {
            setNewAnchor("Wächter aktiv");
            workoutInterval = setInterval(() => {
                if (isPrepared && !isGracePeriodActive) {
                    timeRemainingSeconds--; updateTimerUI();
                    if (timeRemainingSeconds <= 0) {
                        clearInterval(workoutInterval); isPrepared = false;
                        status.innerText = "TRAINING BEENDET! 🎉"; status.style.color = "#00ffcc"; timerDisplay.style.color = "#00ffcc"; speak("Training beendet. Ausgezeichnet.", true);
                    }
                }
            }, 1000);
        }

        function setNewAnchor(audioMessage) {
            anchorPose = {}; 
            currentProfile.joints.forEach(jointName => {
                if (f(jointName)) { anchorPose[jointName] = { x: latestKeypoints[jointName].position.x, y: latestKeypoints[jointName].position.y }; }
            });
            isPrepared = true; isGracePeriodActive = false; movementDetectedTime = null;
            status.innerText = "Überwachung aktiv! 🟢"; status.style.color = "#00ffcc"; timerDisplay.style.color = "#ffffff"; container.style.borderColor = "#333333";
            if (audioMessage) speak(audioMessage, true);
        }

        function loop() {
            canvas.width = 257; canvas.height = 257;
            const minDim = Math.min(video.videoWidth, video.videoHeight);
            ctx.save(); ctx.translate(257, 0); ctx.scale(-1, 1);
            ctx.drawImage(video, (video.videoWidth - minDim) / 2, (video.videoHeight - minDim) / 2, minDim, minDim, 0, 0, 257, 257); ctx.restore();
            requestAnimationFrame(loop);
        }

        async function checkRules() {
            if (!net || video.readyState < 2) return;
            const pose = await net.estimateSinglePose(canvas);
            
            latestKeypoints = {};
            pose.keypoints.forEach(k => { latestKeypoints[k.part] = k; });

            // UI Indikatoren zeichnen
            const draw = (el, part) => { if (f(part)) { el.style.left = `${(latestKeypoints[part].position.x / 257) * container.clientWidth}px`; el.style.top = `${(latestKeypoints[part].position.y / 257) * container.clientHeight}px`; el.style.display = 'block'; } else { el.style.display = 'none'; } };
            draw(pts.lS, 'leftShoulder'); draw(pts.rS, 'rightShoulder'); draw(pts.lW, 'leftWrist'); draw(pts.rW, 'rightWrist');
            draw(pts.lE, 'leftElbow'); draw(pts.rE, 'rightElbow'); // NEU: Zeichnet die lila Ellbogen-Punkte

            if (!isPrepared || !anchorPose || !currentProfile) return;

            // --- ANTI-CHEAT ---
            if (document.getElementById('modPresence').checked && (!f('leftShoulder') || !f('rightShoulder'))) {
                status.innerText = "ANTI-CHEAT: Keine Person erkannt! 🔴"; status.style.color = "#ff3333"; timerDisplay.style.color = "#ff3333"; speak("Workout abgebrochen", true);
                clearInterval(workoutInterval); isPrepared = false; return;
            }

            // --- LIVE-ÜBERWACHUNG ---
            if (document.getElementById('modAnchor').checked) {
                let positionShifted = false;

                currentProfile.joints.forEach(jointName => {
                    if (f(jointName) && anchorPose[jointName]) {
                        const cur = latestKeypoints[jointName].position;
                        const anc = anchorPose[jointName];
                        if (Math.sqrt(Math.pow(cur.x - anc.x, 2) + Math.pow(cur.y - anc.y, 2)) > currentProfile.limits[jointName]) { positionShifted = true; }
                    }
                });

                if (positionShifted || isGracePeriodActive) {
                    const now = Date.now();
                    if (!isGracePeriodActive) { isGracePeriodActive = true; movementDetectedTime = now; speak("Korrigiere", true); }
                    const remainingSeconds = 3 - Math.floor((now - movementDetectedTime) / 1000);

                    if (remainingSeconds > 0) {
                        status.innerText = `KORREKTURZEIT! Noch ${remainingSeconds}s... ⏳`; status.style.color = "#ffaa00"; timerDisplay.style.color = "#ffaa00"; container.style.borderColor = "#ffaa00"; speak(remainingSeconds.toString());
                    } else {
                        if (validatePositionConditions()) { setNewAnchor("Checkpoint"); } 
                        else {
                            timeRemainingSeconds += 10; updateTimerUI(); speak("Strafe plus zehn Sekunden", true);
                            movementDetectedTime = Date.now(); status.innerText = "HALTUNG FALSCH! +10s! Erneuter Versuch... ⏳"; status.style.color = "#ff3333"; timerDisplay.style.color = "#ff3333";
                        }
                    }
                } else { status.innerText = "Überwachung aktiv! 🟢"; status.style.color = "#00ffcc"; timerDisplay.style.color = "#ffffff"; container.style.borderColor = "#333333"; }
            }
            prevPose = { shoulder: (f('leftShoulder') && f('rightShoulder')) ? { x: (latestKeypoints.leftShoulder.position.x + latestKeypoints.rightShoulder.position.x)/2, y: (latestKeypoints.leftShoulder.position.y + latestKeypoints.rightShoulder.position.y)/2 } : null };
        }
    </script>
</body>
</html>
